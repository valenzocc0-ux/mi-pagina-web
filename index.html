<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links Personales de contacto-VZ</title>
    <!-- Importamos una tipografía sans-serif geométrica similar a la de la imagen -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-image: url('fondotextura.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0f172a; 
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .profile-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #a3c9a3;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid #f3eada;
        }

        .profile-img {
            width: 80%;
            height: auto;
            object-fit: contain;
        }

        .handle {
            font-size: 0.9rem;
            color: #f3eada;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-link {
            display: block;
            background-color: #f3eada; 
            color: #1e3a5f;
            padding: 16px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid #e0d9c6;
        }

        .btn-link:hover {
            background-color: #e0d9c6;
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-circle">
            <img src="foto - copia.jpg" alt="Mi Foto" class="profile-img">
        </div>
        
        <p class="handle">VALENTINO ZOCCO TELLERIA</p>

        <div class="links-list">
            <a href="https://www.instagram.com/valenzocco/" class="btn-link">Instagraml</a>
            <a href="https://www.linkedin.com/in/valentino-zocco-telleria-24554a30a/?isSelfProfile=true" class="btn-link">Linkedin</a>
        </div>
    </div>

</body>
</html>
