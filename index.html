<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentino Zocco - Mis Enlaces</title>
    <!-- Importamos la tipografía Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    /* Animación de flotación suave */
@keyframes float {
  0% {
    transform: translateY(0px);
  }
  50% {
    transform: translateY(-10px); /* Sube 10 píxeles */
  }
  100% {
    transform: translateY(0px);
  }
}
    body {
      font-family: 'Poppins', sans-serif;
      background-image: url('nuevatextura.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
.glass-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      /* NUEVO: Aplicamos la animación */
      animation: float 6s ease-in-out infinite;
    }
    .profile-circle {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px auto;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.5);
    }
    .profile-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .handle {
      margin-bottom: 25px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    ..btn-link {
      display: block;
      position: relative;
      background: rgba(255, 255, 255, 0.9);
      color: #111;
      padding: 14px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.5px;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    .btn-link:hover {
      background: #ffffff;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 25px rgba(0, 150, 255, 0.4); /* Resplandor azul sutil al hacer hover */
      color: #000;
    }
</style>
</head>
<body>

    <!-- Tarjeta principal de cristal -->
    <div class="glass-card">
        <div class="profile-circle">
            <img src="foto.jpg" alt="Valentino Zocco" class="profile-img">
        </div>
        
        <p class="handle">VALENTINO ZOCCO TELLERIA</p>

        <div class="links-list">
            <a href="https://www.instagram.com/valenzocco/" class="btn-link">Instagram</a>
            <a href="https://www.linkedin.com/in/valentino-zocco-telleria-24554a30a/?isSelfProfile=true" class="btn-link">Linkedin</a>
        </div>
    </div>

</body>
</html>
