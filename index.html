<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Valentino Zocco Telleria | Portfolio</title>
  
  <!-- Favicon SVG -->
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%23005187"/><text x="50%" y="50%" font-family="Arial, sans-serif" font-size="45" font-weight="bold" fill="%2384b6f4" dominant-baseline="central" text-anchor="middle">VZ</text></svg>'>
  
  <!-- Font Awesome para los íconos -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #005187;
      --shadow-light: rgba(255, 255, 255, 0.15);
      --shadow-dark: rgba(0, 0, 0, 0.4);
      --accent-cyan: #84b6f4;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* =========================================================
       HUD OVERLAY (Textos de fondo)
       ========================================================= */
    .hud-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .hud-text {
      position: absolute;
      font-family: monospace;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .hud-top-left { top: 24px; left: 24px; }
    .hud-top-right { top: 24px; right: 24px; }
    .hud-bottom-left { bottom: 24px; left: 24px; }
    .hud-bottom-right { bottom: 24px; right: 24px; }

    .status-dot {
      display: inline-block;
      width: 6px; height: 6px;
      background-color: #00ff88;
      border-radius: 50%;
      margin-right: 8px;
      box-shadow: 0 0 8px #00ff88;
    }

    /* =========================================================
       TARJETA NEUMÓRFICA PRINCIPAL
       ========================================================= */
    .neumorphic-card {
      width: 90%;
      max-width: 400px;
      background: var(--bg-base);
      border-radius: 36px;
      padding: 40px 30px;
      text-align: center;
      position: relative;
      z-index: 5;
      box-shadow: 
        -14px -14px 30px var(--shadow-light),
         14px  14px 35px var(--shadow-dark);
    }

    /* =========================================================
       AVATAR
       ========================================================= */
    .avatar-container {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px auto;
      border-radius: 50%;
      padding: 4px;
      background: var(--bg-base);
      box-shadow: 
        -6px -6px 12px var(--shadow-light),
         6px  6px 12px var(--shadow-dark);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 2px solid rgba(132, 182, 244, 0.5);
      box-shadow: 0 0 15px rgba(132, 182, 244, 0.3);
      
      /* Renderizado por hardware */
      image-rendering: -webkit-optimize-contrast;
      image-rendering: auto;
      transform: translate3d(0, 0, 0); 
      -webkit-transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      filter: blur(0px) contrast(1.02); 
      -webkit-font-smoothing: subpixel-antialiased;
    }

    /* =========================================================
       NOMBRE ESCULPIDO
       ========================================================= */
    .engraved-name {
      margin: 16px auto 30px auto;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #ffffff; 
      text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.6);
      user-select: none;
      cursor: default;
    }

    /* =========================================================
       BOTONES NEUMÓRFICOS Y EFECTOS HOVER
       ========================================================= */
    .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .neumorphic-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 24px;
      border-radius: 16px;
      background: var(--bg-base);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      transition: all 0.2s ease-in-out;
      box-shadow: 
        -6px -6px 12px var(--shadow-light),
         6px  6px 12px var(--shadow-dark);
    }

    /* Transición suave para el color de los iconos */
    .neumorphic-btn i {
      font-size: 1.2rem;
      transition: all 0.3s ease;
    }

    .neumorphic-btn:active {
      box-shadow: 
        inset -4px -4px 8px var(--shadow-light),
        inset  4px  4px 8px var(--shadow-dark);
      color: var(--accent-cyan);
    }

    /* Iluminación de íconos al pasar el mouse (Hover) */
    .btn-instagram:hover i {
      color: #E1306C;
      text-shadow: 0 0 12px rgba(225, 48, 108, 0.7);
    }
    
    .btn-linkedin:hover i {
      color: #0077b5;
      text-shadow: 0 0 12px rgba(0, 119, 181, 0.7);
    }
    
    .btn-whatsapp:hover i {
      color: #25D366;
      text-shadow: 0 0 12px rgba(37, 211, 102, 0.7);
    }

    /* Línea separadora */
    .divider {
      height: 1px;
      background: rgba(0, 0, 0, 0.2);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.1);
      margin: 10px 0;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Textos de fondo (HUD) -->
  <div class="hud-overlay">
    <div class="hud-text hud-top-left">[ VZ ] CORE V2.4</div>
    <div class="hud-text hud-top-right">TANDIL, AR • 21:42:41</div>
    <div class="hud-text hud-bottom-left"><span class="status-dot"></span>STATUS: AVAILABLE</div>
    <div class="hud-text hud-bottom-right">SYS // NEUMORPHIC</div>
  </div>

  <!-- Tarjeta principal -->
  <div class="neumorphic-card">
    
    <div class="avatar-container">
      <img src="foto.jpg" alt="Valentino Zocco" class="avatar-img">
    </div>

    <div class="engraved-name">
      VALENTINO ZOCCO TELLERIA
    </div>
<div class="buttons-container">
      <!-- Botones con clases específicas (btn-instagram, etc.) -->
      <a href="TU_LINK_DE_INSTAGRAM" class="neumorphic-btn btn-instagram">
        <i class="fa-brands fa-instagram"></i>
        <span>Instagram</span>
      </a>
      
      <a href="TU_LINK_DE_LINKEDIN" class="neumorphic-btn btn-linkedin">
        <i class="fa-brands fa-linkedin-in"></i>
        <span>LinkedIn</span>
      </a>
      
      <a href="TU_LINK_DE_WHATSAPP" class="neumorphic-btn btn-whatsapp">
        <i class="fa-brands fa-whatsapp"></i>
        <span>WhatsApp</span>
      </a>
      
      <hr class="divider">
      
      <!-- BOTÓN DE DESCARGA DE CV -->
      <a href="EL_NOMBRE_DE_TU_ARCHIVO_EN_GITHUB.pdf" download="CV Valentino Zocco Telleria.pdf" class="neumorphic-btn">
        <i class="fa-solid fa-file-arrow-down"></i>
        <span>Descargar CV</span>
      </a>
    </div>
